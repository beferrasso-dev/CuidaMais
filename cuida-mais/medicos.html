<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuida+ | Agendar consulta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/medicos.css">
</head>
<body>
  <div id="cabecalho"></div>

  <main>
    <h1>Agendar consulta</h1>
    <p class="subtitulo">Encontre o profissional ideal e escolha o melhor horário.</p>

    <form class="card filtros" id="form-filtros">
      <div class="campo">
        <label for="filtro-especialidade">Especialidade</label>
        <select class="input" id="filtro-especialidade">
          <option value="">Todas as especialidades</option>
        </select>
      </div>
      <div class="campo">
        <label for="filtro-data">Data da consulta</label>
        <input class="input" type="date" id="filtro-data">
      </div>
      <div class="campo">
        <label for="filtro-nome">Buscar médico</label>
        <input class="input" type="search" id="filtro-nome" placeholder="Nome do médico" autocomplete="off">
      </div>
      <button type="submit" class="btn btn-primario">Buscar</button>
      <button type="button" class="btn-link" id="btn-limpar">Limpar</button>
    </form>

    <p class="texto-suave contador" id="contador" aria-live="polite"></p>
    <section class="grade-medicos" id="lista-medicos" aria-label="Médicos disponíveis"></section>
  </main>

  <footer id="rodape"></footer>

  <script src="js/data/dados-iniciais.js"></script>
  <script src="js/utils/Storage.js"></script>
  <script src="js/utils/Formatadores.js"></script>
  <script src="js/utils/Validador.js"></script>
  <script src="js/utils/Calendario.js"></script>
  <script src="js/models/Usuario.js"></script>
  <script src="js/models/Medico.js"></script>
  <script src="js/models/Consulta.js"></script>
  <script src="js/models/Avaliacao.js"></script>
  <script src="js/services/AuthService.js"></script>
  <script src="js/services/MedicoService.js"></script>
  <script src="js/services/ConsultaService.js"></script>
  <script src="js/services/AvaliacaoService.js"></script>
  <script src="js/ui/Layout.js"></script>
  <script src="js/ui/Toast.js"></script>
  <script src="js/ui/Modal.js"></script>
  <script src="js/ui/Estrelas.js"></script>
  <script src="js/pages/medicos.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => MedicosPage.iniciar());</script>
</body>
</html>
